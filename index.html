<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Moth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Nunito:wght@600;700&display=swap">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="coach" aria-live="polite"><span class="line"></span><span class="key"></span></div>
  <div id="hud" hidden><span class="lamps" hidden><i></i><i></i><i></i></span><span class="goal">Wake the sleeping spirit</span><span class="count" hidden></span></div>
  <div id="banner" hidden></div>
  <div id="courtbar" hidden>
    <button data-act="undo" aria-label="Undo"><b>Undo</b><kbd>Z</kbd></button>
    <button data-act="restart" aria-label="Restart"><b>Restart</b><kbd>R</kbd></button>
    <button data-act="leave" aria-label="Step off the court"><b>Step off</b><kbd>Esc</kbd></button>
  </div>
  <div id="result" hidden>
    <div class="stars" aria-label="Stars"><i></i><i></i><i></i></div>
    <p class="route"></p>
    <div class="actions"><button data-act="retry">Try for three</button><button data-act="next" class="primary">Next</button></div>
  </div>
  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <button id="btn-paw" aria-label="Bap">Bap</button>
    <button id="btn-jump" aria-label="Jump">Jump</button>
  </div>
  <div id="start">
    <div class="card">
      <b>Moth</b>
      <span>Mill Terrace</span>
      <button id="go">Wake up</button>
      <small id="controls-hint"></small>
    </div>
  </div>
  <div id="dev" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
