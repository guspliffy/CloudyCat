<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Moth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Nunito:wght@600;700&display=swap">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="coach" aria-live="polite"><span class="line"></span><span class="key"></span></div>
  <div id="hud" hidden><span class="lamps"><i></i><i></i><i></i></span><span class="goal">Wake the sleeping spirit</span></div>
  <div id="banner" hidden></div>
  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <button id="btn-paw" aria-label="Bap">Bap</button>
    <button id="btn-jump" aria-label="Jump">Jump</button>
  </div>
  <div id="start">
    <div class="card">
      <b>Moth</b>
      <span>Mill Terrace</span>
      <button id="go">Wake up</button>
      <small id="controls-hint"></small>
    </div>
  </div>
  <div id="dev" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
